[project]
name = "python-practice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
[tool.mypy]
exclude = [
    "chat.py",
    "chat_memory.py",
    "stream_test.py",
    "chat_persist.py",
    "demo_.*\\.py",
    "run_samples.py",
    "tool.py",
    "log_practice.py",
    "mock.py",
]